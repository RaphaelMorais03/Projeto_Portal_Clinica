<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a1f44; color: #fff; font: 16px system-ui, sans-serif; }
    main { margin: 24px; text-align: center; }
    h1 { font-size: 24px; }
    a { color: #fff; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>Confira o endereço ou retorne à tela de acesso.</p>
    <a id="voltarPortal" href="/login.html">Voltar ao portal</a>
  </main>
  <script>
    // [v1.0] Em GitHub Pages, o projeto pode estar em um subdiretório.
    const base = location.pathname.match(/^\/Projeto_Portal_Clinica(?=\/|$)/i);
    if (base) document.getElementById('voltarPortal').href = base[0] + '/login.html';
  </script>
</body>
</html>
