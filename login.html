<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Interno</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="js/firebase-config.js"></script>
  <script src="js/shared-utils.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
    html,body{height:100%;}
    body{background:#0a1429;color:#fff;overflow-x:hidden;}

    /* SPLASH */
    #splash{position:fixed;inset:0;background:#0a1429;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:1000;transition:opacity .5s ease;}
    #splash.fade{opacity:0;pointer-events:none;}
    .sp-logo{width:72px;height:72px;border-radius:18px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:spPop .55s cubic-bezier(.34,1.56,.64,1) both;}
    .sp-logo img{width:100%;height:100%;object-fit:contain;padding:10px;}
    .sp-s{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:1.8px;text-transform:uppercase;font-weight:700;animation:spFu .4s .15s ease both;}
    .sp-dots{display:flex;gap:7px;animation:spFu .4s .25s ease both;}
    .sp-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);}
    .sp-dots span:nth-child(1){animation:spDot 1.2s 0s ease-in-out infinite;}
    .sp-dots span:nth-child(2){animation:spDot 1.2s .2s ease-in-out infinite;}
    .sp-dots span:nth-child(3){animation:spDot 1.2s .4s ease-in-out infinite;}
    @keyframes spPop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
    @keyframes spFu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes spDot{0%,80%,100%{background:rgba(255,255,255,.15);transform:scale(.85);}40%{background:#818cf8;transform:scale(1.2);}}

    /* LOGIN */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;}
    .login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(99,102,241,.12) 0%,transparent 45%),radial-gradient(circle at 80% 70%,rgba(13,148,136,.08) 0%,transparent 45%);pointer-events:none;}
    .card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:42px 34px 34px;position:relative;z-index:2;box-shadow:0 24px 60px rgba(0,0,0,.4);}
    .brand{display:flex;flex-direction:column;align-items:center;margin-bottom:30px;}
    .brand-logo{width:64px;height:64px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;}
    .brand-logo img{width:100%;height:100%;object-fit:contain;padding:10px;}
    .brand-tag{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#6366f1;}
    .title-block{margin-bottom:26px;}
    .title{font-size:22px;font-weight:800;color:#0A1F44;letter-spacing:-.5px;margin-bottom:5px;}
    .subtitle{font-size:13px;color:#64748b;line-height:1.55;}
    .field{margin-bottom:15px;}
    .field label{display:block;font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
    .input-wrap{position:relative;display:flex;align-items:center;border:1.5px solid #e2e8f0;border-radius:11px;background:#f8fafc;transition:all .18s;}
    .input-wrap:focus-within{border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.12);}
    .input-wrap.err{border-color:#C62828;background:#fef2f2;box-shadow:0 0 0 3px rgba(198,40,40,.1);animation:shake .4s ease;}
    @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
    .input-ic{padding:0 13px;color:#94a3b8;font-size:13px;flex-shrink:0;}
    .input-wrap:focus-within .input-ic{color:#6366f1;}
    .input-wrap input{flex:1;padding:12px 0;border:none;background:transparent;font-family:inherit;font-size:13.5px;color:#1e293b;outline:none;}
    .input-wrap input::placeholder{color:#94a3b8;}
    .eye{padding:0 13px;background:none;border:none;cursor:pointer;color:#94a3b8;font-size:13px;transition:color .15s;}
    .eye:hover{color:#475569;}
    .err-box{display:none;align-items:center;gap:9px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:11px 14px;margin-bottom:15px;font-size:12.5px;color:#991b1b;font-weight:600;line-height:1.5;}
    .err-box.show{display:flex;animation:shake .4s ease;}
    .btn{width:100%;padding:13px;background:#0A1F44;color:#fff;border:none;border-radius:11px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;transition:all .18s;letter-spacing:-.2px;}
    .btn:hover:not(:disabled){background:#122b5e;transform:translateY(-1px);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .btn .spin{display:none;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;}
    @keyframes rot{to{transform:rotate(360deg);}}
    .btn.loading .spin{display:block;}
    .footer{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:10.5px;color:rgba(255,255,255,.28);z-index:3;letter-spacing:.3px;}
    .footer b{color:rgba(255,255,255,.45);font-weight:700;}

    /* PORTAL (após login) */
    #telaPortal{display:none;min-height:100vh;}
    .hd{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15);}
    .hd-l{display:flex;align-items:center;gap:12px;}
    .hd-logo{width:36px;height:36px;border-radius:9px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .hd-logo img{width:100%;height:100%;object-fit:contain;padding:5px;}
    .hd-name{font-size:13.5px;font-weight:800;color:#0A1F44;letter-spacing:-.2px;}
    .hd-tag{font-size:9.5px;color:#6366f1;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;}
    .hd-r{display:flex;align-items:center;gap:10px;}
    .user-chip{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;padding:6px 14px 6px 6px;font-size:11.5px;font-weight:700;color:#374151;display:flex;align-items:center;gap:8px;}
    .user-chip .av{width:22px;height:22px;border-radius:50%;background:#0A1F44;color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;}
    .btn-sair{background:#C62828;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s;}
    .btn-sair:hover{background:#ad1f1f;}
    .wrap{max-width:1160px;margin:0 auto;padding:38px 26px 80px;position:relative;z-index:1;}
    .greet{margin-bottom:26px;}
    .greet-sub{font-size:11.5px;color:#8496bf;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;}
    .greet-h{font-size:26px;font-weight:900;color:#fff;letter-spacing:-.7px;line-height:1.15;}
    .greet-h span{color:#818cf8;}
    .alert{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.22);border-radius:11px;padding:11px 16px;margin-bottom:24px;display:flex;align-items:center;gap:11px;font-size:12.5px;color:#fbbf24;font-weight:600;}
    .alert i{font-size:13px;flex-shrink:0;}
    .alert a{color:#fde68a;text-decoration:none;margin-left:auto;font-weight:800;cursor:pointer;font-size:11.5px;letter-spacing:.2px;}
    .alert a:hover{color:#fff;}
    .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
    .grid.density-compact {grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
    .grid.density-normal  {grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
    .grid.density-large   {grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
    .grid.density-hero    {grid-template-columns:minmax(0,520px);justify-content:center;}
    .mc{background:#fff;border-radius:14px;padding:20px 18px 16px;cursor:pointer;transition:all .18s ease;position:relative;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.08);text-decoration:none;color:inherit;overflow:hidden;}
    .mc:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.22);}
    .mc:hover .mc-go i{transform:translateX(3px);}
    .mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat-color,#94a3b8);opacity:.9;}
    .mc-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
    .mc-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--cat-bg,#f1f5f9);color:var(--cat-color,#475569);}
    .mc-badge{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:10px;letter-spacing:.3px;background:#fef3c7;color:#b45309;}
    .mc-badge.r{background:#fee2e2;color:#C62828;}
    .mc-title{font-size:14.5px;font-weight:800;color:#0A1F44;letter-spacing:-.3px;margin-bottom:5px;}
    .mc-desc{font-size:11.5px;color:#64748b;line-height:1.55;flex:1;}
    .mc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid #f3f4f6;}
    .mc-status{font-size:10.5px;color:#9ca3af;font-weight:600;}
    .mc-go{font-size:11.5px;font-weight:800;color:#0A1F44;display:flex;align-items:center;gap:5px;}
    .mc-go i{font-size:10px;transition:transform .18s;}
    .mc.hero{padding:28px 26px 22px;}
    .mc.hero .mc-ic{width:52px;height:52px;border-radius:13px;font-size:20px;}
    .mc.hero .mc-title{font-size:20px;letter-spacing:-.5px;margin-bottom:8px;}
    .mc.hero .mc-desc{font-size:13px;line-height:1.6;}
    .mc.hl{border:1.5px solid #0d9488;background:linear-gradient(180deg,#f0fdfa 0%,#fff 40%);}
    .mc.hl .mc-ic{background:#ccfbf1;color:#0d9488;}
    .mc.hl::before{background:#0d9488;}
    .mc.navy{background:linear-gradient(135deg,#0A1F44 0%,#122b5e 100%);border:1px solid #122b5e;}
    .mc.navy::before{background:#818cf8;}
    .mc.navy .mc-ic{background:rgba(255,255,255,.12);color:#fff;}
    .mc.navy .mc-title,.mc.navy .mc-desc,.mc.navy .mc-go,.mc.navy .mc-status{color:#fff;}
    .mc.navy .mc-desc{color:rgba(255,255,255,.65);}
    .mc.navy .mc-foot{border-top-color:rgba(255,255,255,.1);}
    .mc.navy .mc-badge{background:rgba(255,255,255,.15);color:#fff;}
    @media(max-width:768px){.wrap{padding:24px 16px 80px;}.greet-h{font-size:21px;}.hd{padding:0 16px;}.hd-name,.hd-tag{display:none;}}
  </style>
</head>
<body>

<!-- ═════════ SPLASH ═════════ -->
<div id="splash">
  <div class="sp-logo"><img src="assets/favicon.png" alt=""></div>
  <div class="sp-s">Carregando portal</div>
  <div class="sp-dots"><span></span><span></span><span></span></div>
</div>

<!-- ═════════ LOGIN ═════════ -->
<div class="login-wrap" id="telaLogin" style="display:none;">
  <div class="card">
    <div class="brand">
      <div class="brand-logo"><img src="assets/favicon.png" alt=""></div>
      <div class="brand-tag">Portal Interno</div>
    </div>
    <div class="title-block">
      <div class="title">Bem-vindo de volta</div>
      <div class="subtitle">Entre com sua conta pra acessar o portal.</div>
    </div>
    <div class="err-box" id="errBox">
      <i class="fas fa-circle-exclamation"></i>
      <span id="errMsg">E-mail ou senha incorretos.</span>
    </div>
    <div class="field">
      <label>E-mail</label>
      <div class="input-wrap" id="wrapEmail">
        <span class="input-ic"><i class="fas fa-envelope"></i></span>
        <input type="email" id="fEmail" placeholder="seu@email.com" autocomplete="email" autofocus>
      </div>
    </div>
    <div class="field">
      <label>Senha</label>
      <div class="input-wrap" id="wrapSenha">
        <span class="input-ic"><i class="fas fa-lock"></i></span>
        <input type="password" id="fSenha" placeholder="••••••••" autocomplete="current-password">
        <button class="eye" type="button" onclick="toggleEye()"><i class="fas fa-eye" id="eyeIco"></i></button>
      </div>
    </div>
    <button class="btn" id="btnLogin" onclick="doLogin()">
      <div class="spin"></div>
      <span id="btnTxt">Entrar no Portal</span>
    </button>
  </div>
</div>

<!-- ═════════ PORTAL ═════════ -->
<div id="telaPortal">
  <header class="hd">
    <div class="hd-l">
      <div class="hd-logo"><img src="assets/favicon.png" alt=""></div>
      <div>
        <div class="hd-name">Portal</div>
        <div class="hd-tag">Interno</div>
      </div>
    </div>
    <div class="hd-r">
      <div class="user-chip"><span class="av" id="userAv">--</span><span id="userName">—</span></div>
      <button class="btn-sair" onclick="sair()"><i class="fas fa-right-from-bracket"></i> Sair</button>
    </div>
  </header>
  <div class="wrap">
    <div class="greet">
      <div class="greet-sub">Bem-vindo de volta</div>
      <div class="greet-h">Olá, <span id="greetName">—</span>.</div>
    </div>
    <div class="alert" id="alertStrip" style="display:none;">
      <i class="fas fa-bell"></i>
      <span id="alertText"></span>
      <a onclick="irParaDashboard()" id="alertLink">Ver →</a>
    </div>
    <div class="grid" id="cardsGrid"></div>
  </div>
</div>

<div class="footer"><b>v5.0</b> · Portal Interno</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

  const app  = initializeApp(window.FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db   = getDatabase(app);
  window.initFirebaseUtils(db, ref, get);

  /* Catálogo de módulos — ordem define a exibição */
  const MODULOS = [
    { key:'dashboard',  nome:'Dashboard',           desc:'Produção, NPS, ranking, comissões, contratos e visão geral.', href:'pages/dashboard.html', icon:'fa-chart-line', cor:'#818cf8', bg:'rgba(255,255,255,.12)', navy:true, perm:'admin', badge:'principal' },
    { key:'caixa',      nome:'Caixa',               desc:'Fechamento de turno, relatório AMEI, recibos e caixa odonto.', href:'pages/caixa.html', icon:'fa-cash-register', cor:'#1d4ed8', bg:'#dbeafe', perm:'caixa' },
    { key:'nf',         nome:'NF em Lote',          desc:'Gera lote do dia, compara com Sinaxys e envia Nº NF pro Sheets.', href:'pages/dashboard.html#nf', icon:'fa-file-invoice', cor:'#0d9488', bg:'#ccfbf1', perm:'admin', hl:true },
    { key:'fech',       nome:'Fechamentos',         desc:'Repasse por profissional, impostos PJ e recibos consolidados.', href:'pages/fechamento.html', icon:'fa-file-invoice-dollar', cor:'#6d28d9', bg:'#ede9fe', perm:'fechamento' },
    { key:'crono',      nome:'Cronograma',          desc:'Agenda por sala, checklist de abertura e controle de caixa.', href:'pages/cronograma.html', icon:'fa-calendar-week', cor:'#b45309', bg:'#fef3c7', perm:'cronograma' },
    { key:'orcamentos', nome:'Orçamentos',          desc:'Catálogo de exames, valores, parceiros e preparos.', href:'pages/orcamentos.html', icon:'fa-file-invoice-dollar', cor:'#C62828', bg:'#fee2e2', perm:'orcamento' },
    { key:'exames',     nome:'Retirada de Exames',  desc:'Gaveta digital de exames — cadastro, baixa e histórico.', href:'pages/exames.html', icon:'fa-vials', cor:'#0d9488', bg:'#ccfbf1', perm:'exames' },
    { key:'financeiro', nome:'Financeiro',          desc:'Recibos em lote e cadastro da equipe.', href:'pages/financeiro.html', icon:'fa-coins', cor:'#b45309', bg:'#fef3c7', perm:'financeiro' },
    { key:'nps',        nome:'NPS',                 desc:'Pesquisa de satisfação, ranking e histórico por período.', href:'pages/nps.html', icon:'fa-star', cor:'#a855f7', bg:'#f5f3ff', perm:'nps' },
    { key:'contratos',  nome:'Contratos',           desc:'Gerador de contrato de neuropsicologia e encaminhamento.', href:'pages/contratos.html', icon:'fa-file-contract', cor:'#15803d', bg:'#dcfce7', perm:'contratos' },
    { key:'cadastros',  nome:'Cadastros',           desc:'Parceiros, exames e profissionais.', href:'pages/cadastros.html', icon:'fa-database', cor:'#475569', bg:'#f1f5f9', perm:'admin' },
    { key:'admin',      nome:'Painel Admin',        desc:'Usuários, clínica e permissões de acesso.', href:'pages/admin.html', icon:'fa-shield-halved', cor:'#b45309', bg:'#fef3c7', perm:'admin' }
  ];

  function esconderSplash(){ const s=document.getElementById('splash'); s.classList.add('fade'); setTimeout(()=>{s.style.display='none';},450); }

  function toggleEye(){
    const i=document.getElementById('fSenha'), ic=document.getElementById('eyeIco');
    if(i.type==='password'){i.type='text';ic.className='fas fa-eye-slash';}
    else{i.type='password';ic.className='fas fa-eye';}
  }
  window.toggleEye = toggleEye;

  function showError(msg){
    const box=document.getElementById('errBox');
    document.getElementById('errMsg').textContent=msg;
    document.getElementById('wrapEmail').classList.add('err');
    document.getElementById('wrapSenha').classList.add('err');
    box.classList.remove('show'); void box.offsetWidth; box.classList.add('show');
    setTimeout(()=>{
      document.getElementById('wrapEmail').classList.remove('err');
      document.getElementById('wrapSenha').classList.remove('err');
    },600);
  }
  function clearError(){
    document.getElementById('errBox').classList.remove('show');
    document.getElementById('wrapEmail').classList.remove('err');
    document.getElementById('wrapSenha').classList.remove('err');
  }

  function setLoad(on){
    const b=document.getElementById('btnLogin');
    b.disabled=on; b.classList.toggle('loading',on);
    document.getElementById('btnTxt').textContent = on ? 'Autenticando...' : 'Entrar no Portal';
  }

  window.doLogin = function(){
    const email=document.getElementById('fEmail').value.trim();
    const senha=document.getElementById('fSenha').value;
    clearError();
    if(!email){ showError('Informe o e-mail.'); return; }
    if(!senha){ showError('Informe a senha.'); return; }
    setLoad(true);
    signInWithEmailAndPassword(auth,email,senha).catch(e=>{
      setLoad(false);
      if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(e.code)) showError('E-mail ou senha incorretos.');
      else if(e.code==='auth/too-many-requests') showError('Muitas tentativas. Aguarde alguns minutos.');
      else showError('Erro de conexão. Tente novamente.');
    });
  };

  window.sair = function(){
    signOut(auth).then(()=>{ sessionStorage.clear(); location.reload(); });
  };

  document.addEventListener('keydown', e=>{ if(e.key==='Enter' && document.getElementById('telaLogin').style.display!=='none') window.doLogin(); });

  /* Renderização dos cards */
  function renderCards(perms, nome){
    const isAdmin = !!perms.admin;
    const visiveis = MODULOS.filter(m => isAdmin || perms[m.perm] || m.key==='caixa');
    const grid = document.getElementById('cardsGrid');
    grid.className = 'grid ' + (visiveis.length<=1?'density-hero':visiveis.length<=2?'density-large':visiveis.length<=5?'density-normal':'density-compact');
    grid.innerHTML = visiveis.map(m=>`
      <a class="mc ${m.navy?'navy':''} ${m.hl?'hl':''}" style="--cat-color:${m.cor};--cat-bg:${m.bg};" onclick="abrirModulo('${m.href}','${m.nome}')">
