<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Amor Saúde Pirituba</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="../js/firebase-config.js"></script>
  <script src="../js/shared-utils.js"></script>
  <style>
    :root{--navy:#0A1F44;--navy-mid:#122b5e;--red:#C62828;--red-h:#ad1f1f;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-800:#1e293b;--green:#15803d;--green-bg:#dcfce7;--amber:#92400e;--amber-bg:#fef3c7;--shadow:0 4px 20px rgba(10,31,68,.1);}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#f0f4f8;color:var(--gray-800);min-height:100vh;}
    .red-bar{height:3px;background:var(--red);position:fixed;top:0;left:0;right:0;z-index:200;}
    .s-header{background:white;border-bottom:2px solid var(--gray-200);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:3px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.05);}
    .s-logo{display:flex;align-items:center;gap:12px;}
    .s-logo-icon{width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
    .s-logo-icon img{width:100%;height:100%;object-fit:contain;}
    .s-logo-name{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.3px;}
    .s-logo-sub{font-size:10px;color:var(--gray-400);}
    .header-right{display:flex;align-items:center;gap:10px;}
    .back-btn{background:var(--red);color:white;border:none;border-radius:8px;padding:6px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s;}
    .back-btn:hover{background:var(--red-h);}
    .content{max-width:1100px;margin:0 auto;padding:24px 24px 60px;}
    .tabs{display:flex;gap:6px;margin-bottom:22px;background:white;border:1px solid var(--gray-200);border-radius:14px;padding:6px;box-shadow:var(--shadow);}
    .tab-btn{flex:1;padding:10px 14px;border:none;background:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray-400);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s;}
    .tab-btn:hover{color:var(--navy);background:var(--gray-50);}
    .tab-btn.active{color:white;background:var(--navy);box-shadow:0 4px 12px rgba(10,31,68,.25);}
    .tab-pane{display:none;}.tab-pane.active{display:block;}
    .panel{background:white;border:1px solid var(--gray-200);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow);}
    .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--gray-100);}
    .panel-title{font-size:15px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;}
    .panel-title i{color:var(--red);}
    .f-label{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--gray-500);display:block;margin-bottom:5px;}
    .f-input,.f-select{padding:9px 12px;border:1.5px solid var(--gray-200);border-radius:9px;font-family:inherit;font-size:14px;color:var(--gray-800);background:var(--gray-50);outline:none;transition:border-color .2s;width:100%;}
    .f-input:focus,.f-select:focus{border-color:var(--navy);background:white;}
    .btn-p{padding:9px 18px;background:var(--navy);color:white;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s,transform .15s;}
    .btn-p:hover{background:var(--navy-mid);transform:translateY(-1px);}
    .btn-s{padding:9px 14px;background:var(--gray-100);color:var(--gray-600);border:1.5px solid var(--gray-200);border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;}
    .btn-s:hover{background:var(--gray-200);}
    .btn-r{padding:9px 14px;background:var(--red);color:white;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s;}
    .btn-r:hover{background:var(--red-h);}
    .btn-g{padding:9px 14px;background:var(--green);color:white;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s;}
    .btn-g:hover{background:#166534;}
    .colab-card{background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:14px;padding:16px;margin-bottom:10px;transition:all .18s;}
    .colab-card:hover{border-color:var(--navy);}
    .colab-top{display:flex;align-items:center;gap:12px;}
    .colab-avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0;}
    .colab-info{flex:1;}
    .colab-nome{font-size:14px;font-weight:800;color:var(--navy);}
    .colab-cargo{font-size:11px;color:var(--gray-400);}
    .colab-actions{display:flex;gap:6px;}
    .recibo-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:10px;margin-bottom:6px;}
    .recibo-nome{flex:1;font-size:13px;font-weight:700;color:var(--navy);}
    .recibo-val{font-size:13px;font-weight:800;color:var(--green);}
    .recibo-ts{font-size:10px;color:var(--gray-400);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .itens-list{margin-bottom:14px;}
    .item-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
    .empty-state{text-align:center;padding:48px;color:var(--gray-400);}
    .empty-state i{font-size:36px;margin-bottom:12px;opacity:.35;display:block;}
    .stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
    .stat-card{background:white;border:1px solid var(--gray-200);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
    .stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .stat-num{font-size:24px;font-weight:900;color:var(--navy);letter-spacing:-1px;line-height:1;}
    .stat-lbl{font-size:11px;color:var(--gray-400);margin-top:2px;}
    .toast-box{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
    .toast{padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;color:white;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:sIn .3s ease;max-width:320px;}
    @keyframes sIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    .toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--navy);}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
    .modal-bg.open{display:flex;}
    .modal-box{background:white;border-radius:18px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);}
    .modal-head{padding:18px 22px 14px;border-bottom:2px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:10;}
    .modal-title{font-size:16px;font-weight:800;color:var(--navy);}
    .modal-close{background:var(--gray-100);border:1px solid var(--gray-200);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-500);font-size:14px;}
    .modal-close:hover{background:var(--gray-200);}
    .modal-body{padding:22px;}
    @media(max-width:768px){.stats-bar,.form-grid{grid-template-columns:1fr;}.content{padding:14px 14px 60px;}}
    .btn-bonif-fin{padding:7px 14px;border-radius:8px;border:1.5px solid var(--gray-200);background:white;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--navy);transition:all .15s;}
    .btn-bonif-fin:hover{border-color:var(--navy);background:#eff6ff;}
    .btn-bonif-fin.ativo{background:var(--navy);color:white;border-color:var(--navy);}
    .serv-row{display:flex;align-items:center;gap:8px;background:white;border:1.5px solid var(--gray-200);border-radius:8px;padding:7px 10px;}
    .serv-row input{border:1.5px solid var(--gray-200);border-radius:7px;padding:6px 9px;font-family:inherit;font-size:12px;outline:none;}
    .serv-row input:focus{border-color:var(--navy);}
    .btn-rem-serv{background:#fee2e2;border:none;color:#dc2626;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;font-weight:900;flex-shrink:0;font-family:inherit;}
  </style>
</head>
<body>
  <div class="red-bar"></div>
  <div class="toast-box" id="toastBox"></div>

  <!-- MODAL COLABORADOR -->
  <div class="modal-bg" id="modalColab">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title" id="modalColabTitle">Novo Colaborador</div>
        <button class="modal-close" onclick="fecharModalColab()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom:14px;">
          <label class="f-label">Nome completo</label>
          <input class="f-input" id="cNome" placeholder="Ex: Maria das Dores Silva">
        </div>
        <div class="form-grid" style="margin-bottom:14px;">
          <div>
            <label class="f-label">Cargo</label>
            <input class="f-input" id="cCargo" placeholder="Ex: Recepcionista">
          </div>
          <div>
            <label class="f-label">CPF</label>
            <input class="f-input" id="cCpf" placeholder="000.000.000-00" oninput="mascaraCPF(this)" maxlength="14">
          </div>
        </div>

        <div style="display:flex;gap:10px;">
          <button class="btn-s" onclick="fecharModalColab()" style="flex:1;justify-content:center;"><i class="fas fa-xmark"></i> Cancelar</button>
          <button class="btn-p" onclick="salvarColab()" style="flex:2;justify-content:center;"><i class="fas fa-floppy-disk"></i> Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL IMPRESSÃO EM LOTE -->
  <div class="modal-bg" id="modalLote">
    <div class="modal-box" style="max-width:700px;">
      <div class="modal-head">
        <div class="modal-title"><i class="fas fa-layer-group"></i> Impressão em Lote</div>
        <button class="modal-close" onclick="fecharModalLote()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">

        <div class="form-grid" style="margin-bottom:16px;">
          <div>
            <label class="f-label">Categoria</label>
            <select class="f-select" id="loteCat" onchange="toggleCatExtras()">
              <option value="Salário">Salário</option>
              <option value="Vale-Transporte">Vale-Transporte</option>
              <option value="Cesta Básica">Cesta Básica</option>
              <option value="Adiantamento">Adiantamento de Salário</option>
              <option value="Bonificação">Bonificação</option>
              <option value="Prestação de Serviço">Prestação de Serviço</option>
              <option value="Limpeza de Manguitos">Limpeza de Manguitos</option>
            </select>
          </div>
          <!-- BONIFICAÇÃO -->
          <div id="catBonifWrap" style="display:none;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:12px;">
            <label class="f-label" style="margin-bottom:8px;display:block;">Referente a (selecione um ou mais)</label>
            <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;" id="lBonifOpcoes">
              <button class="btn-bonif-fin" data-val="avaliações" onclick="toggleBonifFin(this)">⭐ Avaliações</button>
              <button class="btn-bonif-fin" data-val="comissão" onclick="toggleBonifFin(this)">💰 Comissão</button>
              <button class="btn-bonif-fin" data-val="cirurgia" onclick="toggleBonifFin(this)">🏥 Cirurgia</button>
              <button class="btn-bonif-fin" data-val="boleto" onclick="toggleBonifFin(this)">📄 Boleto</button>
              <button class="btn-bonif-fin" data-val="plano odontológico" onclick="toggleBonifFin(this)">🦷 Plano Odontológico</button>
            </div>
            <div id="lBonifValores" style="display:flex;flex-direction:column;gap:7px;"></div>
            <div id="lBonifTotal" style="display:none;margin-top:8px;padding:7px 12px;background:var(--navy);color:white;border-radius:7px;font-size:12px;font-weight:700;text-align:right;"></div>
          </div>
          <!-- PRESTAÇÃO DE SERVIÇO -->
          <div id="catServWrap" style="display:none;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <label class="f-label">Serviços prestados</label>
              <button onclick="addServicoFin()" style="padding:4px 12px;background:var(--navy);color:white;border:none;border-radius:7px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;">+ Adicionar</button>
            </div>
            <div id="lServicos" style="display:flex;flex-direction:column;gap:7px;"></div>
            <div id="lServTotal" style="display:none;margin-top:8px;padding:7px 12px;background:var(--navy);color:white;border-radius:7px;font-size:12px;font-weight:700;text-align:right;"></div>
          </div>
          <!-- PERÍODO -->
          <div style="display:flex;gap:8px;align-items:flex-end;">
            <div style="flex:1;">
              <label class="f-label">Período início</label>
              <input class="f-input" id="loteInicio" type="date">
            </div>
            <div style="flex:1;">
              <label class="f-label">Período fim</label>
              <input class="f-input" id="loteFim" type="date">
            </div>
          </div>
        </div>
        <div class="form-grid" style="margin-bottom:14px;">
          <div>
            <label class="f-label">Forma de pagamento</label>
            <select class="f-select" id="loteForma">
              <option value="pix">PIX</option>
              <option value="dinheiro">Dinheiro</option>
              <option value="transferencia">Transferência</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;">Colaboradores</span>
          <div style="display:flex;gap:6px;">
            <button class="btn-s" style="font-size:11px;padding:5px 10px;" onclick="selecionarTodosLote(true)">Todos</button>
            <button class="btn-s" style="font-size:11px;padding:5px 10px;" onclick="selecionarTodosLote(false)">Nenhum</button>
          </div>
        </div>
        <div id="loteLista" style="max-height:320px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:10px;padding:8px;background:var(--gray-50);"></div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button class="btn-s" onclick="fecharModalLote()" style="flex:1;justify-content:center;"><i class="fas fa-xmark"></i> Cancelar</button>
          <button class="btn-p" onclick="imprimirLote()" style="flex:2;justify-content:center;"><i class="fas fa-print"></i> Gerar e Imprimir Lote</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL GERAR RECIBO -->
  <div class="modal-bg" id="modalRecibo">
    <div class="modal-box" style="max-width:600px;">
      <div class="modal-head">
        <div class="modal-title">Gerar Recibo — <span id="reciboNomeColab">—</span></div>
        <button class="modal-close" onclick="fecharModalRecibo()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <!-- Tipo de recibo: Padrão ou Manual -->
        <div style="display:flex;gap:6px;margin-bottom:16px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:5px;">
          <button id="btnReciboPadrao" onclick="setTipoRecibo('padrao')"
            style="flex:1;padding:8px 10px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;background:var(--navy);color:white;transition:all .2s;">
            <i class="fas fa-file-invoice"></i> Padrão
          </button>
          <button id="btnReciboManual" onclick="setTipoRecibo('manual')"
            style="flex:1;padding:8px 10px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;background:none;color:var(--gray-500);transition:all .2s;">
            <i class="fas fa-pen"></i> Manual
          </button>
        </div>

        <!-- PADRÃO -->
        <div id="reciboPadraoFields">
          <div class="form-grid" style="margin-bottom:14px;">
            <div>
              <label class="f-label">Categoria</label>
              <select class="f-select" id="rCat">
                <option value="Salário">Salário</option>
                <option value="Vale-Transporte">Vale-Transporte</option>
                <option value="Bonificação">Bonificação</option>
                <option value="Adiantamento">Adiantamento</option>
              </select>
            </div>
            <div>
              <label class="f-label">Valor (R$)</label>
              <input class="f-input" id="rValor" placeholder="0,00" oninput="mascaraMoeda(this)">
            </div>
          </div>
          <div class="form-grid" style="margin-bottom:14px;">
            <div>
              <label class="f-label">Período início</label>
              <input class="f-input" id="rInicio" type="date">
            </div>
            <div>
              <label class="f-label">Período fim</label>
              <input class="f-input" id="rFim" type="date">
            </div>
          </div>
        </div>

        <!-- MANUAL -->
        <div id="reciboManualFields" style="display:none;">
          <div style="margin-bottom:14px;">
            <label class="f-label">Descrição do recibo</label>
            <textarea class="f-input" id="rDesc" rows="3" placeholder="Ex: Reembolso de despesas — Maio/2026" style="resize:vertical;"></textarea>
            <button type="button" onclick="geminiCompletar('rDesc','recibo manual',{nome:document.getElementById('reciboNomeColab').textContent,valor:document.getElementById('rValorManual').value})" style="margin-top:6px;padding:6px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#1a73e8,#7c3aed);color:white;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;">✨ Completar com IA</button>
          </div>
          <div style="margin-bottom:14px;">
            <label class="f-label">Valor (R$)</label>
            <input class="f-input" id="rValorManual" placeholder="0,00" oninput="mascaraMoeda(this)">
          </div>
        </div>

        <!-- CAMPOS COMUNS -->
        <div class="form-grid" style="margin-bottom:14px;">
          <div>
            <label class="f-label">Forma de pagamento</label>
            <select class="f-select" id="rForma">
              <option value="pix">PIX</option>
              <option value="dinheiro">Dinheiro</option>
              <option value="transferencia">Transferência</option>
            </select>
          </div>
          <div>
            <label class="f-label">Observação (opcional)</label>
            <input class="f-input" id="rObs" placeholder="Ex: Inclui benefícios">
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn-s" onclick="fecharModalRecibo()" style="flex:1;justify-content:center;"><i class="fas fa-xmark"></i> Cancelar</button>
          <button class="btn-g" onclick="gerarEImprimirRecibo()" style="flex:1;justify-content:center;"><i class="fas fa-print"></i> Gerar e Imprimir</button>
          <button class="btn-p" onclick="salvarRecibo()" style="flex:2;justify-content:center;"><i class="fas fa-floppy-disk"></i> Salvar e Imprimir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <div class="s-header">
    <div class="s-logo">
      <div class="s-logo-icon"><img src="../assets/favicon.png" alt="Logo" id="headerLogo"></div>
      <div><div class="s-logo-name">Amor Saúde</div><div class="s-logo-sub">Financeiro · Pirituba</div></div>
    </div>
    <div class="header-right">
      <button class="back-btn" onclick="irPara('../login.html')"><i class="fas fa-home"></i> Portal</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-icon" style="background:#eff6ff;color:#1d4ed8;"><i class="fas fa-users"></i></div><div><div class="stat-num" id="stColab">0</div><div class="stat-lbl">Colaboradores</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--green-bg);color:var(--green);"><i class="fas fa-receipt"></i></div><div><div class="stat-num" id="stRecibos">0</div><div class="stat-lbl">Recibos emitidos</div></div></div>

  // ── Valor por extenso ──
  function valorExtenso(valor) {
    if (!valor || valor === 0) return 'zero reais';
    const uni = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove'];
    const dez = ['','dez','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
    const esp = ['dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
    const cen = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
    let inteiro = Math.floor(valor);
    let centavos = Math.round((valor - inteiro) * 100);
    function conv(n) {
      if (n === 0) return '';
      if (n === 100) return 'cem';
      if (n >= 1000) { let m = Math.floor(n/1000), r = n%1000; return (m===1?'mil':conv(m)+' mil')+(r>0?' e '+conv(r):''); }
      let c=Math.floor(n/100),d=Math.floor((n%100)/10),u=n%10,s='';
      if(c)s+=cen[c]; if(c&&(d||u))s+=' e '; if(d===1)s+=esp[u]; else{if(d)s+=dez[d];if(d&&u)s+=' e ';if(u)s+=uni[u];}
      return s;
    }
    let ext = conv(inteiro)+(inteiro===1?' real':' reais');
    if(centavos>0) ext+=' e '+conv(centavos)+(centavos===1?' centavo':' centavos');
    return ext;
  }

  function renderLoteLista() {
    const el = document.getElementById('loteLista');

    // Mescla Firebase + base, deduplicando por CPF (Firebase tem prioridade)
    const allItems = [];
    const fbCpfs   = new Set();

    Object.entries(colaboradores).forEach(([k, c]) => {
      const raw = (c.cpf || '').replace(/\D/g, '');
      if (raw) fbCpfs.add(raw);
      allItems.push({ key: k, nome: c.nome || '—', cargo: c.cargo || '', cpf: c.cpf || '' });
    });

    colabBaseRaw.forEach((c, i) => {
      const raw = (c.cpf || '').replace(/\D/g, '');
      if (fbCpfs.has(raw)) return; // já existe no Firebase
      allItems.push({ key: 'base_' + i, nome: c.nome, cargo: '', cpf: formatCPF(c.cpf) });
    });

    if (!allItems.length) { el.innerHTML = '<p style="padding:12px;text-align:center;color:#888;">Nenhum colaborador.</p>'; return; }

    allItems.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  function imprimirLote() {
    const cat     = document.getElementById('loteCat').value;
    const inicio  = document.getElementById('loteInicio').value;
    const fim     = document.getElementById('loteFim').value;
    const desc    = ''; // categoria + período auto-preenche no recibo
    const usuario = sessionStorage.getItem('usuario') || 'Financeiro';

    const itens = [];
    document.querySelectorAll('.lote-check:checked').forEach(cb => {
      const k = cb.dataset.key;
      const valInput = document.querySelector(`.lote-valor[data-key="${k}"]`);
      const valorStr = ((valInput ? valInput.value : '') || '').replace(/\./g,'').replace(',','.');
      const valor = parseFloat(valorStr) || 0;
      if (valor <= 0) return;

      let colab;
      if (k.startsWith('base_')) {
        const idx = parseInt(k.replace('base_', ''), 10);
        const raw = colabBaseRaw[idx];
        colab = { nome: raw.nome, cpf: formatCPF(raw.cpf), cargo: '' };
      } else {
        colab = colaboradores[k];
      }
      if (colab) itens.push({ colab, valor });
    });

    if (!itens.length) { toast('Selecione ao menos um colaborador com valor', 'error'); return; }

    const clinicaNome = sessionStorage.getItem('clinicaNome') || 'Amor Saúde Pirituba';
    const clinicaCnpj = sessionStorage.getItem('clinicaCnpj') || '';
    const logo = LOGO_FIN || sessionStorage.getItem('logoDataUrl') || '';

    const blocos = itens.map((it, i) => {
      const loteFrm = document.getElementById('loteForma') ? document.getElementById('loteForma').value : 'pix';
      const bloco = buildReciboBlock(it.colab,
        { descricao: desc, valor: it.valor, categoria: cat, inicio, fim, usuario, forma: loteFrm },
        logo, clinicaNome, clinicaCnpj);
      // quebra de página a cada 4 recibos
      const quebra = ((i + 1) % 3 === 0 && i + 1 < itens.length)
        ? '<div style="page-break-after:always;"></div>' : '';
      return bloco + quebra;
    }).join('<hr class="corte">');

    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Lote de Recibos</title>
      <style>${RECIBO_CSS}</style></head><body>
      ${blocos}
      <sc`+'ript>window.print();</s'+'cript></body></html>';

    const w = window.open('', '_blank');
    if (!w) { toast('Pop-up bloqueado — permita pop-ups', 'error'); return; }
    w.document.write(html);
    w.document.close();
    fecharModalLote();
  }

  function coletarDadosRecibo() {
    const isPadrao  = _tipoRecibo === 'padrao';
    const categoria = isPadrao ? document.getElementById('rCat').value : '';
    const descricao = isPadrao ? '' : document.getElementById('rDesc').value.trim();
    const valEl     = isPadrao ? document.getElementById('rValor') : document.getElementById('rValorManual');
    const valorStr  = (valEl ? valEl.value : '').replace(/\./g,'').replace(',','.');
    const valor     = parseFloat(valorStr) || 0;
    const inicio    = isPadrao ? document.getElementById('rInicio').value : '';
    const fim       = isPadrao ? document.getElementById('rFim').value : '';
    const forma     = document.getElementById('rForma').value;
    const obs       = document.getElementById('rObs').value.trim();
    return { descricao, valor, categoria, inicio, fim, forma, obs, isPadrao };
  }

  function gerarEImprimirRecibo() {
    const c = colaboradores[colabAtualKey] || {};
    const dados = coletarDadosRecibo();
    if (!dados.isPadrao && !dados.descricao) { toast('Informe a descrição', 'error'); return; }
    if (!dados.valor) { toast('Informe o valor', 'error'); return; }
    const usuario = sessionStorage.getItem('usuario') || 'Financeiro';
    const w = window.open('', '_blank');
    if (!w) { toast('Pop-up bloqueado — permita pop-ups', 'error'); return; }
    w.document.write(montarHtmlRecibo(c, {...dados, usuario}, usuario));
    w.document.close();
  }

  async function salvarRecibo() {
    const c = colaboradores[colabAtualKey] || {};
    const dados = coletarDadosRecibo();
    if (!dados.isPadrao && !dados.descricao) { toast('Informe a descrição', 'error'); return; }
    if (!dados.valor) { toast('Informe o valor', 'error'); return; }
    const usuario = sessionStorage.getItem('usuario') || 'Financeiro';
    try {
      await window._fbSet('financeiro/recibos/' + Date.now(), {
        colabKey: colabAtualKey, colabNome: c.nome || '—', colabCargo: c.cargo || '', colabCpf: c.cpf || '',
        ...dados, usuario, emitidoEm: new Date().toISOString()
      });
      toast('Recibo salvo!', 'success');
      fecharModalRecibo();
    } catch(e) { toast('Erro ao salvar: ' + e.message, 'error'); }
    const w = window.open('', '_blank');
    if (!w) { toast('Pop-up bloqueado — permita pop-ups', 'error'); return; }
    w.document.write(montarHtmlRecibo(c, {...dados, usuario}, usuario));
    w.document.close();
  }

  // ── Histórico ──
  let todosRecibos = [];

  function renderHistorico() {
    const q   = (document.getElementById('buscaHistorico').value || '').toLowerCase();
    const mes = document.getElementById('filtroMes').value;
    let lista = todosRecibos.filter(r => {
      const matchNome = !q || (r.colabNome || '').toLowerCase().includes(q);
      const matchMes  = !mes || (r.emitidoEm || '').startsWith(mes);
      return matchNome && matchMes;
    });
    const el = document.getElementById('listaHistorico');
    if (!lista.length) { el.innerHTML = '<div class="empty-state"><i class="fas fa-clock-rotate-left"></i><p>Nenhum recibo encontrado.</p></div>'; return; }
    el.innerHTML = lista.map(r => {
      const dt = r.emitidoEm ? new Date(r.emitidoEm).toLocaleString('pt-BR') : '—';
      return '<div class="recibo-row">' +
        '<div style="width:36px;height:36px;border-radius:8px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;"><i class="fas fa-receipt"></i></div>' +
        '<div style="flex:1;">' +
          '<div class="recibo-nome">' + esc(r.colabNome || '—') + (r.colabCargo ? ' <span style="font-weight:400;color:var(--gray-400);">· ' + esc(r.colabCargo) + '</span>' : '') + '</div>' +
          '<div style="font-size:11px;color:var(--gray-500);">' + esc(r.descricao || '—') + ' · ' + ({pix:'PIX',dinheiro:'Dinheiro',transferencia:'Transferência'}[r.forma]||r.forma||'—') + '</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div class="recibo-val">R$ ' + fmtMoeda(r.valor) + '</div>' +
          '<div class="recibo-ts">' + dt + '</div>' +
          (r.pago ? '<div style="font-size:10px;color:var(--green);font-weight:700;">✓ Quitado</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  function filtrarHistorico() { renderHistorico(); }

  function atualizarStats() {
    const agora = new Date();
    const mesAtual = agora.getFullYear() + '-' + String(agora.getMonth()+1).padStart(2,'0');
    const recibosDoMes = todosRecibos.filter(r => (r.emitidoEm || '').startsWith(mesAtual));
    const totalMes = recibosDoMes.reduce((s, r) => s + (parseFloat(r.valor) || 0), 0);
    document.getElementById('stRecibos').textContent = todosRecibos.length;
    document.getElementById('stTotal').textContent = 'R$ ' + fmtMoeda(totalMes);
  }
  </script>

  <script type="module">
    import { initializeApp }          from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, get, set, remove, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const app  = initializeApp(window.FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db   = getDatabase(app);
    window.initFirebaseUtils(db, ref, get);
    window._fbSet    = (path, data) => set(ref(db, path), data);
    window._fbRemove = (path)       => remove(ref(db, path));

    window.geminiCompletar = async function(campoId, tipo, ctx) {
      if (!window._geminiKey) { alert('IA não configurada. Verifique a chave Gemini no Firebase.'); return; }
      const campo = document.getElementById(campoId);
      const textoAtual = campo.value.trim();
      const btn = event.target.closest('button');
      const textoOriginal = btn.innerHTML;
      btn.innerHTML = '⏳ Gerando...';
      btn.disabled = true;

      const partes = [];
      if (ctx.nome)  partes.push('Colaborador: ' + ctx.nome);
      if (ctx.valor) partes.push('Valor: R$ ' + ctx.valor);
      const contexto = partes.join(' | ');

      const prompt = `Você auxilia o setor financeiro de uma clínica médica a registrar ocorrências de forma clara e objetiva. Reescreva o texto abaixo como uma descrição de recibo de ${tipo}: direta, sem jargão jurídico, com no máximo 2 frases, para que qualquer pessoa do financeiro entenda o que aconteceu e por quê. Retorne APENAS a descrição final, sem explicações ou aspas.

${contexto ? 'Dados do recibo: ' + contexto : ''}
Texto original: ${textoAtual || '(não informado)'}`;

      try {
        const key = window._geminiKey;
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=' + key, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: 800, temperature: 0.3 } })
        });
        const data = await res.json();
        console.log('[Gemini]', res.status, JSON.stringify(data));
        const texto = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        if (texto) campo.value = texto;
        else alert('Erro ' + res.status + ': ' + (data.error?.message || 'Tente novamente.'));
      } catch(e) {
        alert('Erro ao conectar com a IA. Verifique sua conexão.');
      } finally {
        btn.innerHTML = textoOriginal;
        btn.disabled = false;
      }
    };

    onAuthStateChanged(auth, user => {
      if (!user) { irPara('../login.html'); return; }
      carregarLogoGlobal(['#headerLogo']).then(() => {
        window.LOGO_FIN = sessionStorage.getItem('logoDataUrl') || '';
      });

      // Chave Gemini para IA de descrições
      get(ref(db, 'admin/config/geminiKey')).then(snap => {
        if (snap.val()) window._geminiKey = snap.val();
      }).catch(()=>{});

      // Colaboradores
      onValue(ref(db, 'financeiro/colaboradores'), snap => {
        colaboradores = snap.exists() ? snap.val() : {};
        renderColabs();
      });

      // Recibos
      onValue(ref(db, 'financeiro/recibos'), snap => {
        const raw = snap.exists() ? snap.val() : {};
        todosRecibos = Object.entries(raw).map(([k,v]) => ({_key:k,...v})).sort((a,b) => b._key.localeCompare(a._key));
        atualizarStats();
        // Preencher filtro de meses
        const meses = [...new Set(todosRecibos.map(r => (r.emitidoEm||'').slice(0,7)).filter(Boolean))];
        const sel = document.getElementById('filtroMes');
        sel.innerHTML = '<option value="">Todos os meses</option>' +
          meses.map(m => `<option value="${m}">${m}</option>`).join('');
        if (document.getElementById('paneHistorico').classList.contains('active')) renderHistorico();
      });

      // Log
      set(ref(db, 'admin_logs/' + Date.now()), { tipo:'info', msg:(user.email||user.uid)+' acessou Financeiro', ts:new Date().toISOString() }).catch(()=>{});
    });
  </script>
</body>

  else if(catN.indexOf('manguito')>=0){titulo='RECIBO — LIMPEZA DE MANGUITOS';lblTipo='limpeza de manguitos';prep='referente ao período de';}
  var periodoTxt='';
  if(dados.inicio&&dados.fim){periodoTxt=dados.inicio.split('-').reverse().join('/')+' a '+dados.fim.split('-').reverse().join('/');}
  else if(dados.inicio){periodoTxt=dados.inicio.split('-').reverse().join('/');}
  var itensExtras=dados.itensExtras||[];
  var formaMap={pix:'PIX',dinheiro:'Dinheiro',transferencia:'Transferência'};
  var formaSel=formaMap[dados.forma]||dados.forma||'';
  var logoHtml=logoSrc?'<img src="'+logoSrc+'" alt="Logo" style="height:44px;width:auto;object-fit:contain;display:block;margin:0 auto;">':'';
  var corpoPeriodo='.';
  if(itensExtras.length){corpoPeriodo=' '+prep+': '+itensExtras.map(function(it){return '<strong>'+esc(it.label)+' — R$ '+fmtMoeda(it.valor)+'</strong>';}).join(', ')+'.';}
  else if(periodoTxt){corpoPeriodo=' '+prep+' <strong>'+esc(periodoTxt)+'</strong>.';}
  window._RECIBO_CSS_ADDON = '@page{size:A4 portrait;margin:17mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#fff;color:#1a1a1a;zoom:85%}.pagina{display:flex;flex-direction:column;gap:5mm;min-height:263mm;page-break-after:always;break-after:page;}.pagina:last-child{page-break-after:auto;break-after:auto;}.rec{border:1.5px solid #1a1a1a;padding:14px 18px;flex:1;}.rec-titulo{font-size:14px;font-weight:800;text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}.rec-empresa{font-size:10.5px;text-align:center;color:#444;margin-bottom:7px;}.rec-divider{border:none;border-top:1.5px solid #1a1a1a;margin:7px 0;}.rec-empregado{margin-bottom:7px;border-bottom:.5px solid #ccc;padding-bottom:6px;}.rec-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#666;display:block;}.rec-campo{font-size:12px;font-weight:600;}.rec-vbox{border:2px solid #1a1a1a;display:flex;align-items:center;gap:10px;padding:6px 12px;margin:7px 0;}.rec-rs{font-size:15px;font-weight:800;background:#1a1a1a;color:#fff;padding:4px 9px;}.rec-vnum{font-size:20px;font-weight:900;letter-spacing:-.3px;}.rec-vext{font-size:10.5px;color:#444;font-style:italic;margin-top:2px;}.rec-corpo{font-size:13px;line-height:2;margin:7px 0;text-align:justify;}.rec-data{font-size:11px;text-align:right;margin:7px 0;}.rec-assin-wrap{text-align:center;margin-top:10px;}.rec-assin-linha{border-bottom:1.5px solid #1a1a1a;height:30px;width:100%;max-width:420px;margin:0 auto 4px;}.rec-assin-nome{font-size:10.5px;font-weight:700;}.rec-assin-lbl{font-size:9.5px;color:#555;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}';
  return '<div class="rec">'

function mascaraValorBonifFin(el) {

  el.value=parseFloat((parseInt(v)/100).toFixed(2)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function mascaraServFin(el) {
  var v=el.value.replace(/\D/g,''); if(!v){el.value='';return;}
  el.value=parseFloat((parseInt(v)/100).toFixed(2)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function calcServTotal() {
  var total=0;
  document.querySelectorAll('#lServicos .serv-val').forEach(function(el){total+=parseFloat(String(el.value||0).replace(/\./g,'').replace(',','.'))||0;});
  var div=document.getElementById('lServTotal'); if(!div) return;
  var rows=document.querySelectorAll('#lServicos .serv-row').length;

  else{div.style.display='none';}

function preencherPeriodoAtual() {
  var hoje=new Date(), y=hoje.getFullYear(), m=hoje.getMonth();
  var d1=new Date(y,m,1).toISOString().slice(0,10);
  var df=new Date(y,m+1,0).toISOString().slice(0,10);
  var ini=document.getElementById('loteInicio'); if(ini) ini.value=d1;
  var fim=document.getElementById('loteFim');    if(fim) fim.value=df;
}

/* ── Sobrescrever imprimirLote com suporte a extras ── */
window.imprimirLote = function() {
  var cat=document.getElementById('loteCat').value;
  var inicio=document.getElementById('loteInicio').value;
  var fim=document.getElementById('loteFim').value;
  var usuario=sessionStorage.getItem('usuario')||'Financeiro';
  var catN=cat.toLowerCase();

  var itens=[];
  document.querySelectorAll('.lote-check:checked').forEach(function(cb) {
    var k=cb.dataset.key;
    var valInput=document.querySelector('.lote-valor[data-key="'+k+'"]');
    var valorStr=((valInput?valInput.value:'')||'').replace(/\./g,'').replace(',','.');
    var valor=parseFloat(valorStr)||0; if(valor<=0) return;
    var colab;
    if(k.indexOf('base_')===0){
      var idx=parseInt(k.replace('base_',''),10);
      var raw=colabBaseRaw[idx];
      colab={nome:raw.nome,cpf:formatCPF(raw.cpf),cargo:''};
    } else { colab=colaboradores[k]; }
    if(colab) itens.push({colab:colab,valor:valor});
  });

  if(!itens.length){toast('Selecione ao menos um colaborador com valor','error');return;}

  var clinicaNome=sessionStorage.getItem('clinicaNome')||'Amor Saúde Pirituba';
  var clinicaCnpj=sessionStorage.getItem('clinicaCnpj')||'';
  var logo=window.LOGO_FIN||sessionStorage.getItem('logoDataUrl')||'';
  var loteFrm=document.getElementById('loteForma')?document.getElementById('loteForma').value:'pix';

  var itensExtras=[], valorExtrasTotal=0;
  if(catN.indexOf('bonific')>=0){
    document.querySelectorAll('.btn-bonif-fin.ativo').forEach(function(btn){
      var el=document.getElementById('lbv-'+btn.dataset.val.replace(/[^a-z]/gi,''));
      var v=parseFloat(String((el?el.value:0)||0).replace(/\./g,'').replace(',','.'))||0;
      if(v>0){itensExtras.push({label:btn.dataset.val,valor:v});valorExtrasTotal+=v;}
    });
  } else if(catN.indexOf('presta')>=0||catN.indexOf('servi')>=0){
    document.querySelectorAll('#lServicos .serv-row').forEach(function(row){
      var d2=row.querySelector('.serv-desc')?row.querySelector('.serv-desc').value.trim():'';
      var v=parseFloat(String((row.querySelector('.serv-val')?row.querySelector('.serv-val').value:0)||0).replace(/\./g,'').replace(',','.'))||0;
      if(d2||v>0){itensExtras.push({label:d2||'Serviço',valor:v});valorExtrasTotal+=v;}
    });
  }

  var LOTE_CSS = '@page{size:A4 portrait;margin:17mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#fff;color:#1a1a1a;zoom:85%}.pagina{display:flex;flex-direction:column;gap:5mm;min-height:263mm;page-break-after:always;break-after:page;}.pagina:last-child{page-break-after:auto;break-after:auto;}.rec{border:1.5px solid #1a1a1a;padding:14px 18px;flex:1;}.rec-titulo{font-size:14px;font-weight:800;text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}.rec-empresa{font-size:10.5px;text-align:center;color:#444;margin-bottom:7px;}.rec-divider{border:none;border-top:1.5px solid #1a1a1a;margin:7px 0;}.rec-empregado{margin-bottom:7px;border-bottom:.5px solid #ccc;padding-bottom:6px;}.rec-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#666;display:block;}.rec-campo{font-size:12px;font-weight:600;}.rec-vbox{border:2px solid #1a1a1a;display:flex;align-items:center;gap:10px;padding:6px 12px;margin:7px 0;}.rec-rs{font-size:15px;font-weight:800;background:#1a1a1a;color:#fff;padding:4px 9px;}.rec-vnum{font-size:20px;font-weight:900;letter-spacing:-.3px;}.rec-vext{font-size:10.5px;color:#444;font-style:italic;margin-top:2px;}.rec-corpo{font-size:13px;line-height:2;margin:7px 0;text-align:justify;}.rec-data{font-size:11px;text-align:right;margin:7px 0;}.rec-assin-wrap{text-align:center;margin-top:10px;}.rec-assin-linha{border-bottom:1.5px solid #1a1a1a;height:30px;width:100%;max-width:420px;margin:0 auto 4px;}.rec-assin-nome{font-size:10.5px;font-weight:700;}.rec-assin-lbl{font-size:9.5px;color:#555;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}';

  var paginas=[];
  for(var i=0;i<itens.length;i+=3) paginas.push(itens.slice(i,i+3));

  var paginasHtml=paginas.map(function(grupo){
    var celulas=grupo.map(function(it){
      var valorItem=itensExtras.length&&valorExtrasTotal>0?valorExtrasTotal:it.valor;
      var bloco=window.buildReciboBlock(it.colab,{valor:valorItem,categoria:cat,inicio:inicio,fim:fim,usuario:usuario,forma:loteFrm,itensExtras:itensExtras},logo,clinicaNome,clinicaCnpj);
      return bloco;
    }).join('');
    var vazias=Array(3-grupo.length).fill('<div class="recibo-wrap"></div>').join('');
    return '<div class="pagina">'+celulas+vazias+'</div>';
  }).join('');

  var html='<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Lote</title>'
    +'<style>'+LOTE_CSS+'</style></head><body>'+paginasHtml
    +'<'+'script>window.print();<'+'/script></body></html>';

  var w=window.open('','_blank');
  if(!w){toast('Pop-up bloqueado','error');return;}
  w.document.write(html); w.document.close();
  fecharModalLote();
};

/* ── Sobrescrever abrirModalLote com auto-período e extras ── */
(function() {
  var _orig = window.abrirModalLote;
  window.abrirModalLote = function() {
    if(_orig) _orig();
    preencherPeriodoAtual();
    toggleCatExtras();
    if(!document.querySelector('.serv-row')) addServicoFin();
  };
})();
</script>
