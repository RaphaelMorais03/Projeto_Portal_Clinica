<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <title>Relatório do líder · Amor Saúde</title>
  <style>
    /* [v6.7] página do líder: sem login, só envia relatórios (acesso por link secreto) */
    :root { --navy:#0A1F44; --g50:#F8FAFC; --g200:#E2E8F0; --g500:#64748B; --g800:#1E293B; --ok:#15803D; --err:#B91C1C; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--g50); color:var(--g800); padding-bottom:84px; }
    header { background:var(--navy); color:#fff; padding:16px; }
    header h1 { margin:0; font-size:17px; }
    header p { margin:4px 0 0; font-size:13px; opacity:.85; }
    main { max-width:720px; margin:0 auto; padding:16px; }
    .msg { padding:40px 16px; text-align:center; color:var(--g500); font-size:14px; }
    .card { background:#fff; border:1.5px solid var(--g200); border-radius:14px; margin-bottom:12px; overflow:hidden; }
    .card.has { border-color:var(--navy); }
    .card-h { padding:12px 14px; font-weight:800; color:var(--navy); font-size:15px; display:flex; align-items:center; gap:8px; }
    .card-h .ok { margin-left:auto; font-size:11px; font-weight:700; color:var(--ok); }
    .card-b { padding:0 14px 14px; display:grid; gap:10px; }
    label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--g500); margin-bottom:3px; }
    textarea { width:100%; min-height:64px; resize:vertical; font:inherit; font-size:15px; padding:8px 10px; border:1.5px solid var(--g200); border-radius:10px; }
    textarea:focus { outline:none; border-color:var(--navy); }
    .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1.5px solid var(--g200); padding:12px 16px; display:flex; align-items:center; gap:12px; }
    .bar span { flex:1; font-size:13px; color:var(--g500); }
    button { font:inherit; font-weight:700; font-size:15px; background:var(--navy); color:#fff; border:none; border-radius:10px; padding:12px 18px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .res { max-width:720px; margin:0 auto 12px; padding:0 16px; font-size:13px; }
    .res.ok { color:var(--ok); } .res.err { color:var(--err); }
  </style>
</head>
<body>
  <header><h1>Relatório do líder</h1><p id="quem"></p></header>
  <div id="nomeBox" style="display:none;max-width:720px;margin:16px auto 0;padding:0 16px;"><label for="nomeLider">Seu nome *</label><input type="text" id="nomeLider" maxlength="80" autocomplete="name" placeholder="Digite seu nome" style="width:100%;font:inherit;font-size:15px;padding:10px;border:1.5px solid var(--g200);border-radius:10px;"></div>
  <main id="app"><div class="msg">Carregando…</div></main>
  <div class="res" id="res" role="status"></div>
  <div class="bar" id="bar" style="display:none"><span id="cont">Nada preenchido</span><button id="btnEnviar" type="button">Enviar</button></div>

  <script type="module">
    // [v6.7] SDK modular v11.6.0 (mesma versão do portal). Sem Auth: o acesso é pelo token do link.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, setDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
    import "../js/firebase-config.js";

    var TOKEN = new URLSearchParams(location.search).get('t') || '';
    var $ = function (id) { return document.getElementById(id); };
    var CAMPOS = [['liderTopicos', 'Tópicos que quero abordar', 'Em poucas linhas'], ['liderMelhorias', 'Melhorias', 'O que precisa melhorar'], ['liderMomento', 'Momento atual (minha visão)', 'Como vejo a colaboradora hoje']];
    var db, lider = null, enviadas = {};
    var LS = 'oo_lider_' + TOKEN.slice(0, 12);

    function msg(t) { $('app').innerHTML = ''; var d = document.createElement('div'); d.className = 'msg'; d.textContent = t; $('app').appendChild(d); $('bar').style.display = 'none'; }
    function ler() { try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { return {}; } }
    function gravar(o) { try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {} }
    function areas(id) { return CAMPOS.map(function (c) { return document.getElementById('f_' + id + '_' + c[0]); }); }
    function preenchida(id) { return areas(id).some(function (t) { return t && t.value.trim(); }); }

    function atualizar() {
      var n = 0; (lider.colaboradoras || []).forEach(function (c) {
        var on = preenchida(c.id); if (on) n++;
        var card = document.getElementById('c_' + c.id); if (card) card.classList.toggle('has', on);
      });
      $('cont').textContent = n ? n + (n === 1 ? ' colaboradora preenchida' : ' colaboradoras preenchidas') : 'Nada preenchido';
      $('btnEnviar').disabled = !n || (lider.compartilhado === true && !$('nomeLider').value.trim());
      var o = {}; (lider.colaboradoras || []).forEach(function (c) { var v = {}; CAMPOS.forEach(function (k) { v[k[0]] = document.getElementById('f_' + c.id + '_' + k[0]).value; }); o[c.id] = v; });
      try { if (lider.compartilhado === true) localStorage.setItem(LS + '_nome', $('nomeLider').value); } catch (e) {}
      gravar(o); /* rascunho local no aparelho, para não perder se fechar a página */
    }

    function montar() {
      var app = $('app'); app.innerHTML = ''; var salvo = ler();
      var lista = lider.colaboradoras || [];
      if (!lista.length) { msg('Nenhuma colaboradora na lista.'); return; }
      lista.forEach(function (c) {
        var card = document.createElement('section'); card.className = 'card'; card.id = 'c_' + c.id;
        var h = document.createElement('div'); h.className = 'card-h'; var nm = document.createElement('span'); nm.textContent = c.nome; h.appendChild(nm);
        var ok = document.createElement('span'); ok.className = 'ok'; ok.id = 'ok_' + c.id; h.appendChild(ok); card.appendChild(h);
        var b = document.createElement('div'); b.className = 'card-b';
        CAMPOS.forEach(function (k) {
          var w = document.createElement('div'); var l = document.createElement('label'); l.textContent = k[1]; l.htmlFor = 'f_' + c.id + '_' + k[0];
          var t = document.createElement('textarea'); t.id = l.htmlFor; t.maxLength = 1500; t.placeholder = k[2];
          t.value = (salvo[c.id] && salvo[c.id][k[0]]) || ''; t.addEventListener('input', atualizar);
          w.appendChild(l); w.appendChild(t); b.appendChild(w);
        });
        card.appendChild(b); app.appendChild(card);
      });
      $('bar').style.display = 'flex'; atualizar();
    }

    async function enviar() {
      var btn = $('btnEnviar'); btn.disabled = true; $('res').className = 'res'; $('res').textContent = 'Enviando…';
      var ok = 0, falhou = 0, salvo = ler(), quem = $('nomeLider').value.trim();
      for (var i = 0; i < lider.colaboradoras.length; i++) {
        var c = lider.colaboradoras[i]; if (!preenchida(c.id)) continue;
        var d = { fichaId: c.id, enviadoEm: new Date().toISOString(), importado: false };
        if (lider.compartilhado === true) d.liderNome = quem; /* [v6.8] link único: o líder se identifica */
        CAMPOS.forEach(function (k) { d[k[0]] = document.getElementById('f_' + c.id + '_' + k[0]).value.trim(); });
        try {
          await setDoc(doc(collection(db, 'oneaone_lideres', TOKEN, 'envios')), d);
          ok++; areas(c.id).forEach(function (t) { t.value = ''; }); delete salvo[c.id];
          enviadas[c.id] = (enviadas[c.id] || 0) + 1; document.getElementById('ok_' + c.id).textContent = '✓ enviado' + (enviadas[c.id] > 1 ? ' (' + enviadas[c.id] + 'x)' : '');
        } catch (e) { falhou++; console.error(e); }
      }
      gravar(salvo); atualizar();
      $('res').className = 'res ' + (falhou ? 'err' : 'ok');
      $('res').textContent = falhou ? ok + ' enviado(s); ' + falhou + ' não foi possível enviar. Tente novamente (o texto foi mantido).' : ok + (ok === 1 ? ' relatório enviado. Obrigado!' : ' relatórios enviados. Obrigado!');
    }

    (async function () {
      if (!/^[A-Za-z0-9_-]{20,64}$/.test(TOKEN)) { msg('Link inválido.'); return; }
      try {
        db = getFirestore(initializeApp(window.FIREBASE_CONFIG, 'lider'));
        var s = await getDoc(doc(db, 'oneaone_lideres', TOKEN));
        if (!s.exists() || s.data().ativo !== true) { msg('Link inválido ou desativado. Peça um novo link.'); return; }
        lider = s.data(); $('quem').textContent = 'Olá, ' + (lider.nome || '') + '. Preencha só as colaboradoras que quiser e toque em Enviar.';
        $('btnEnviar').addEventListener('click', enviar);
        if (lider.compartilhado === true) {
          $('quem').textContent = 'Digite seu nome, preencha só as colaboradoras que quiser e toque em Enviar.';
          $('nomeBox').style.display = 'block'; try { $('nomeLider').value = localStorage.getItem(LS + '_nome') || ''; } catch (e) {}
          $('nomeLider').addEventListener('input', function () { if (lider.colaboradoras) atualizar(); });
        }
        montar();
      } catch (e) { console.error(e); msg('Não foi possível abrir o link. Tente novamente em instantes.'); }
    })();
  </script>
</body>
</html>
